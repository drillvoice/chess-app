name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR supersedes the run in flight; don't burn minutes finishing
# a check on a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Every check below runs even when an earlier one fails, so a red build
      # reports everything that is wrong in one pass instead of one problem per
      # push. `!cancelled()` (not `always()`) still honours a cancelled run.
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run type-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
      # `pretest:e2e` installs the Playwright browsers, so there is no separate
      # install step to keep in sync with it.
      - name: E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
